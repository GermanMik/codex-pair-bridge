<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PAIR Bridge — One bridge. Many tools. Your local models.</title>
  <desc id="desc">Compatible tools call an MCP server, which routes through NVIDIA PAIR or directly to configured LM Studio devices and local models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06142c"/><stop offset="1" stop-color="#0b2443"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102d4a"/><stop offset="1" stop-color="#091e36"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51efd1"/><stop offset="1" stop-color="#69aaff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6 1 11" fill="none" stroke="#57e4ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <g opacity=".18" stroke="#24718a"><path d="M0 140H1600M0 270H1600M0 400H1600M0 530H1600M0 660H1600M0 790H1600"/><path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="800" y="83" fill="#f0f6ff" font-size="48" font-weight="750">PAIR Bridge</text>
    <text x="800" y="125" fill="#a8bfd8" font-size="23" letter-spacing="4">ONE BRIDGE · MANY TOOLS · YOUR LOCAL MODELS</text>
    <text x="800" y="166" fill="#7fa1c3" font-size="17">A small MCP server connects compatible clients to models on your own devices</text>
    <g filter="url(#shadow)">
      <rect x="70" y="268" width="300" height="290" rx="24" fill="url(#card)" stroke="#6ea7ff" stroke-width="2"/>
      <rect x="474" y="268" width="320" height="290" rx="24" fill="url(#card)" stroke="#58e4ce" stroke-width="3"/>
      <rect x="900" y="214" width="286" height="190" rx="22" fill="url(#card)" stroke="#6ea7ff" stroke-width="2"/>
      <rect x="900" y="447" width="286" height="190" rx="22" fill="url(#card)" stroke="#6ea7ff" stroke-width="2"/>
      <rect x="1280" y="268" width="250" height="290" rx="24" fill="url(#card)" stroke="#58e4ce" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <g fill="#eef5ff">
      <text x="220" y="314" font-size="24" font-weight="700">Compatible tools</text>
      <text x="634" y="314" font-size="24" font-weight="700">PAIR Bridge</text>
      <text x="1043" y="262" font-size="22" font-weight="700">PAIR router</text>
      <text x="1043" y="495" font-size="22" font-weight="700">Direct LM Studio</text>
      <text x="1405" y="314" font-size="24" font-weight="700">Your devices</text>
    </g>
    <g font-size="19" fill="#b9cce0">
      <text x="220" y="380">Codex · one example</text><text x="220" y="421">Oh My Pi · MCP clients</text><text x="220" y="462">Other compatible tools</text>
      <text x="634" y="370">Discover installed models</text><text x="634" y="410">Check context and capacity</text><text x="634" y="450">Ask · compare · diagnose</text><text x="634" y="490">Manage explicit operations</text>
      <text x="1043" y="317">PAIR selects a connected</text><text x="1043" y="348">model server for a request</text>
      <text x="1043" y="548">Target a configured device</text><text x="1043" y="579">over its native LM Studio API</text>
      <text x="1405" y="382">Mac · Windows</text><text x="1405" y="424">Local models</text><text x="1405" y="466">Configured endpoints</text>
    </g>
    <g fill="none" stroke="url(#mint)" stroke-width="4" marker-end="url(#arrow)">
      <path d="M370 413H462"/><path d="M794 365H880Q892 365 900 354"/><path d="M794 462H880Q892 462 900 485"/>
      <path d="M1186 310H1258Q1270 310 1280 349"/><path d="M1186 540H1258Q1270 540 1280 476"/>
      <path d="M1405 575V706H220V570" stroke-width="3"/>
    </g>
    <text x="800" y="746" fill="#b9cce0" font-size="19">Model answers return to the tool that made the request</text>
    <g transform="translate(70 795)" fill="#142e4a" stroke="#2a5673">
      <rect width="1460" height="66" rx="16"/>
      <text x="182" y="42" fill="#eaf4ff" stroke="none" font-size="18" font-weight="700">Discover</text>
      <text x="547" y="42" fill="#eaf4ff" stroke="none" font-size="18" font-weight="700">Ask &amp; compare</text>
      <text x="912" y="42" fill="#eaf4ff" stroke="none" font-size="18" font-weight="700">Plan memory</text>
      <text x="1277" y="42" fill="#eaf4ff" stroke="none" font-size="18" font-weight="700">Manage safely</text>
    </g>
  </g>
</svg>
