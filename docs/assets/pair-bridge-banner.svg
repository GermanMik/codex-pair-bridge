<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="256" viewBox="0 0 1920 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06172D"/>
      <stop offset=".56" stop-color="#09284A"/>
      <stop offset="1" stop-color="#071A32"/>
    </linearGradient>
    <linearGradient id="brand" x1="326" y1="62" x2="413" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67F0D0"/>
      <stop offset="1" stop-color="#70AFFF"/>
    </linearGradient>
    <linearGradient id="bridge" x1="1200" y1="82" x2="1504" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123C5A"/>
      <stop offset="1" stop-color="#0D304C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(460 0 0 190 1150 132)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31DCC4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#31DCC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" stroke="#7AB7E8" stroke-opacity=".075"/>
      <circle cx="0" cy="0" r="1.6" fill="#7AB7E8" fill-opacity=".2"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <path fill="url(#bg)" d="M0 0h1920v256H0z"/>
  <path fill="url(#grid)" d="M0 0h1920v256H0z"/>
  <ellipse cx="1150" cy="132" fill="url(#glow)" rx="460" ry="190"/>
  <path d="M0 230h1920" stroke="#72A7D4" stroke-opacity=".13"/>

  <!-- Keep the lower-left clear: Reddit overlays the community avatar here. -->
  <g opacity=".34" stroke="#58DCCB" stroke-width="2">
    <path d="M35 206h170v-28h73"/>
    <circle cx="35" cy="206" r="4" fill="#58DCCB"/>
    <circle cx="278" cy="178" r="4" fill="#58DCCB"/>
  </g>
  <path d="M0 0h292v256H0z" fill="#06172D" fill-opacity=".34"/>

  <!-- Shared bridge mark, matching the community icon. -->
  <g transform="translate(330 69)">
    <circle cx="40" cy="40" r="39" fill="#0A2542" stroke="url(#brand)" stroke-width="2"/>
    <path d="M17 40h12m22 0h12M29 40l8-11m6 0 8 11M29 40l8 11m6 0 8-11" stroke="#67E8CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="40" r="5" fill="#A7E84B"/>
    <circle cx="64" cy="40" r="5" fill="#A7E84B"/>
    <circle cx="40" cy="26" r="6" fill="#6CB6FF"/>
    <circle cx="40" cy="54" r="6" fill="#6CB6FF"/>
    <circle cx="40" cy="40" r="5" fill="#F0FBFF"/>
  </g>
  <text x="430" y="108" fill="#F2F7FF" font-family="Inter, SF Pro Display, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="-.8">PAIR Bridge</text>
  <text x="432" y="148" fill="#AFC6E0" font-family="Inter, SF Pro Display, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="2.8">ONE BRIDGE · MANY TOOLS · YOUR LOCAL MODELS</text>

  <!-- A compact left-to-right flow remains legible at Reddit's narrow banner height. -->
  <g font-family="Inter, SF Pro Display, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="906" y="66" width="254" height="56" rx="16" fill="#102D4B" stroke="#6FA9FF" stroke-opacity=".9" stroke-width="1.5"/>
    <text x="1033" y="91" fill="#EDF5FF" font-size="16" font-weight="700">Compatible tools</text>
    <text x="1033" y="109" fill="#AFC6E0" font-size="12">Codex · Oh My Pi · MCP clients</text>

    <path d="M1160 94h39" stroke="#54DCCB" stroke-width="3" stroke-linecap="round"/>
    <path d="m1192 87 8 7-8 7" stroke="#54DCCB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1206" y="53" width="298" height="82" rx="20" fill="url(#bridge)" stroke="#53E3CB" stroke-width="2"/>
    <circle cx="1232" cy="94" r="8" fill="#A7E84B"/>
    <text x="1360" y="88" fill="#F1FFFC" font-size="19" font-weight="700">PAIR Bridge</text>
    <text x="1360" y="111" fill="#B9D8E7" font-size="13">discover · choose · connect</text>

    <path d="M1504 94h42" stroke="#54DCCB" stroke-width="3" stroke-linecap="round"/>
    <path d="m1539 87 8 7-8 7" stroke="#54DCCB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1552" y="66" width="300" height="56" rx="16" fill="#102D4B" stroke="#6FA9FF" stroke-opacity=".9" stroke-width="1.5"/>
    <text x="1702" y="91" fill="#EDF5FF" font-size="16" font-weight="700">Your local models</text>
    <text x="1702" y="109" fill="#AFC6E0" font-size="12">PAIR · LM Studio · your devices</text>
  </g>

  <text x="1375" y="183" fill="#8FB3D2" font-family="Inter, SF Pro Display, Segoe UI, sans-serif" font-size="13" text-anchor="middle" letter-spacing=".55">One bridge. Many tools. Your local models.</text>
  <path d="M906 207h946" stroke="#4AAEBC" stroke-opacity=".26" stroke-linecap="round"/>
</svg>
