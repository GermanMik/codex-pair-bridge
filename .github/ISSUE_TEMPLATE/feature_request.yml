name: Feature request
description: Suggest a focused improvement to PAIR Bridge.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what currently gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change. Avoid including secrets or private prompts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or alternative did you try?
    validations:
      required: false
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options:
        - I can help implement this
        - I can test or review it
        - I am requesting the feature
    validations:
      required: true
